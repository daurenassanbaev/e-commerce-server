server:
  port: 8093
spring:
  application:
    name: "order-service"
  config:
    import: "optional:configserver:http://localhost:8071/"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true # ????????? Flyway ??? ???????? ???? ??????
    baseline-on-migrate: true # ????????? ??????? ?????? ??? ????????
    locations: classpath:db/migration # ???? ? ?????? ????????
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db} # URL ??????????? ? ???? ?????? ??? Flyway
    user: ${DB_USERNAME:postgres} # ??? ???????????? ??? ??????????? ? ???? ?????? ??? Flyway
    password: ${DB_PASSWORD:postgres} # ?????? ??? ??????????? ? ???? ?????? ??? Flyway
    schemas: ${DB_SCHEMAS:public} # ????? ???? ??????, ??????? ?????? ???? ???????????
eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/
